# Requires a restart. Loads only persistent caravan upgrades and cargo management.
lightweight: false

# Requires a restart. Sessions and their map pieces are created in this loaded world.
session-world: Caravans

# Requires a restart. Right-clicking another player opens their profile in these worlds.
inspection-worlds:
- Caravans
- Hub

# Sent to each player when a tutorial ends, whether they win or lose. Supports MiniMessage formatting.
# {player} is replaced with the player's name.
tutorial-end-message: '<dark_gray>[<dark_red><bold>MLMC</bold></dark_red>] <gray>Welcome to the server <yellow>{player}</yellow>!'

# Requires a restart. Upgrade bonuses from caravan.yml are added to these base limits.
caravan:
  cargo:
    capacity: 3000
    unique-items: 5
  fleet-hold:
    capacity: 3000
    unique-items: 5